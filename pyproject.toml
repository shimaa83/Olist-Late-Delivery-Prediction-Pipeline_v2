[project]
name = "task3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shimaa83", email = "alshimaa.abdelraof@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "dvc>=3.67.1",
    "great-expectations>=1.22.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.29.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "skl2onnx>=1.20.0",
    "xgboost>=3.4.1",
]

[project.scripts]
task3 = "task3:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]


[tool.pytest.ini_options]
pythonpath = ["."]
