services:
  # ==========================================
  # خدمة الـ API (FastAPI + ONNX)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: olist-delay-api:latest
    container_name: olist_api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./models:/app/models:ro
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ==========================================
  # خدمة Prometheus (سحب وتجميع الماتريكس)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: olist_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  # ==========================================
  # خدمة Grafana (عرض الداشبورد والرسومات)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: olist_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  api_logs:
